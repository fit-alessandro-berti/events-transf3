# Current best evaluation endpoint for the expert-confidence epoch-40 checkpoint.
#
# Use with:
#   --checkpoint_dir checkpoints/fmv3/expert_confidence_heads
#   --checkpoint_epoch 40
#
# The regression confidence head is retained because it improves MAE, RMSE, and
# R² together. The classification confidence head is deliberately disabled: the
# low-support structured overlay already improves classification decisions, and
# the learned classification confidence logits slightly reduce balanced
# accuracy and macro-F1 on the full confirmation.
extends: structured_low_support_confirmation_eval.yaml
experiment_name: regression_confidence_low_support_confirmation
fmv3_head:
  classification_expert_confidence_enabled: false
  regression_expert_confidence_enabled: true
fmv3_evaluation:
  expert_aggregation_diagnostics: true
  # Sharpen the learned regression expert-confidence weights at inference.
  # Temperature 0.02 improves aggregate MAE, RMSE, median AE, normalized MAE,
  # and R² over both the original temperature-1.0 endpoint and the earlier
  # temperature-0.1 refinement, while preserving the budget ≥4/≥8 improvements.
  regression_expert_confidence_temperature: 0.02
  # Keep the established 50/50 query-dynamic/support-calibrated blend except
  # where the current endpoint screen found same-direction wins:
  # budget 2 is better with no support-calibration blend, while budget 4 is
  # better with a slightly stronger support-calibrated component.
  regression_calibration_mix_by_budget:
    2: 0.0
    4: 0.6
