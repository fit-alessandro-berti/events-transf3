seed: 42
embedding_strategy: learned
moe_settings:
  num_experts: 4
d_model: 256
n_heads: 8
n_layers: 6
dropout: 0.15
lr: 0.0001
weight_decay: 0.01
epochs: 20
episodes_per_epoch: 200
training_strategy: retrieval
episodic_label_shuffle: "yes"
retrieval_train_k: 32
retrieval_train_batch_size: 128
retrieval_min_per_class: 2
retrieval_train_max_classes: 32
retrieval_contrastive_weight: 0.25
retrieval_knn_aux_weight: 0.1
proto_head_lr_mult_after_warmup: 1.0
classification_task_probability: 0.50
classification_label_smoothing: 0.05
# Optional metric-learning refinements on the deployed (pre-projection)
# embedding. Zero defaults preserve all historical checkpoints exactly.
classification_separation_weight: 0.0
classification_separation_temperature: 0.10
classification_separation_margin: 0.15
gradient_clip_norm: 1.0
# Opt-in structured telemetry. Disabled defaults preserve the historical
# training data and runtime path exactly.
training_diagnostics:
  enabled: false
  step_interval: 25
  validation_fraction: 0.10
  validation_steps_per_pool: 1
  validation_seed_offset: 100000
  overfitting_patience: 3
  overfitting_relative_tolerance: 0.02
trainable_scope: all
fmv3_head:
  regression_mode: sqrt_knn
  # Regression modes:
  # - sqrt_knn: historical soft-kNN in stored sqrt(hours) space
  # - raw_hours_knn: soft-kNN directly averaged in raw hours, no transform bank
  # - learned_transform_ensemble: learned monotone target branches in raw hours
  regression_num_transforms: 8
  regression_transform_aggregation: learned
  regression_power_min: 0.05
  regression_power_max: 1.50
  regression_transform_scale_min_hours: 1.0
  regression_transform_scale_max_hours: 10000.0
  regression_scale_augmentation: true
  regression_scale_augmentation_min: 0.02
  regression_scale_augmentation_max: 50.0
  regression_time_input_transforms: false
  regression_time_replace_legacy: false
  regression_input_scale_min_hours: 0.0002777777777777778
  regression_input_scale_max_hours: 10000.0
  regression_input_residual_logit: -2.0
  # New architecture: fully independent learned elapsed/inter-event encoders.
  # Disabled by default so historical checkpoints retain their exact graph.
  temporal_input_transforms: false
  temporal_replace_legacy_inputs: false
  temporal_start_num_transforms: 4
  temporal_start_power_min: 0.05
  temporal_start_power_max: 1.50
  temporal_start_scale_min_hours: 0.016666666666666666
  temporal_start_scale_max_hours: 10000.0
  temporal_start_residual_logit: -3.0
  temporal_previous_num_transforms: 4
  temporal_previous_power_min: 0.05
  temporal_previous_power_max: 1.50
  temporal_previous_scale_min_hours: 0.0002777777777777778
  temporal_previous_scale_max_hours: 1000.0
  temporal_previous_residual_logit: -3.0
  # Optional state-aware prefix projection. The historical CLS/static-query
  # path stays intact and becomes the residual anchor when this is enabled.
  state_aware_prefix_attention: false
  prefix_attention_hidden_dim: 128
  prefix_attention_dropout: 0.15
  prefix_attention_gate_logit: -3.0
  prefix_attention_initial_recency: 0.25
  # Classification-only residual embedding adapter. It is initialized as the
  # identity and never executes for regression.
  classification_embedding_adapter_enabled: false
  classification_embedding_adapter_hidden_dim: 64
  classification_embedding_adapter_dropout: 0.0
  regression_embedding_adapter_enabled: false
  regression_embedding_adapter_hidden_dim: 64
  regression_embedding_adapter_dropout: 0.0
  # Optional task-specific support selectors. Each learns a bounded residual
  # log-weight over already-retrieved examples and starts at exact identity.
  example_selector_hidden_dim: 16
  classification_example_selector_enabled: false
  classification_example_selector_hidden_dim: 16
  classification_example_selector_max_log_weight: 2.0
  classification_example_selector_strength: 1.0
  regression_example_selector_enabled: false
  regression_example_selector_hidden_dim: 16
  regression_example_selector_max_log_weight: 2.0
  regression_example_selector_strength: 1.0
  regression_mae_weight: 0.5
  regression_rmse_weight: 0.5
  # Promoted multi-metric primary objective (renormalized with MAE/RMSE).
  # Historical experiment roots pin these four weights to zero explicitly.
  regression_huber_weight: 0.15
  regression_huber_delta: 1.0
  regression_log_rmse_weight: 0.15
  regression_relative_mae_weight: 0.05
  regression_bias_weight: 0.05
  regression_median_ae_weight: 0.0
  regression_quantile_weight: 0.0
  regression_quantile_level: 0.5
  # Lower scale power partially restores raw-hour weighting; gate aux is opt-in.
  regression_loss_scale_power: 1.0
  regression_loss_reference_hours: 100.0
  regression_gate_aux_weight: 0.0
  regression_gate_target_temperature: 0.1
  classification_expert_confidence_enabled: false
  regression_expert_confidence_enabled: false
  expert_confidence_hidden_dim: 16
  classification_expert_confidence_loss_weight: 0.0
  regression_expert_confidence_loss_weight: 0.0
  # Pre-execution expert routing. Unlike the posterior confidence heads above,
  # this lightweight head can keep rejected experts completely inactive.
  expert_routing_confidence_enabled: false
  expert_routing_architecture: mlp  # task_bias, linear, mlp
  expert_routing_hidden_dim: 32
  expert_routing_dropout: 0.0
  expert_routing_confidence_loss_weight: 0.0
  expert_active_fraction: 0.5
  expert_routing_temperature: 1.0
fmv3_training:
  episode_mix:
    balanced: 0.20
    natural: 0.20
    long_tail: 0.15
    random_shot: 0.15
    missing_local_label: 0.25
    missing_pool_label: 0.05
  long_tail_power: 1.5
  random_shot_min: 1
  random_shot_max: 20
  missing_local_fraction: 1.0
  missing_pool_fraction: 1.0
fmv3_evaluation:
  case_budgets: [1, 2, 4, 8, 16, 32, 64, 128]
  support_scenarios: [natural, class_aware]
  repetitions: 5
  test_case_fraction: 0.30
  max_test_cases: 50
  max_query_prefixes: 1000
  embedding_batch_size: 128
  include_full_budget: true
  include_full_budget_max_cases: 1000
  retrieval_k: [5, 20, 50]
  bootstrap_repetitions: 200
  prior_modes: [balanced, natural]
  prior_strengths: [1.0]
  retrieval_modes: [configured]
  dynamic_retrieval_max_k: 200
  dynamic_retrieval_entropy_threshold: 0.65
  threshold_fraction: 0.90
  structured_max_order: 3
  structured_smoothing: 0.5
  structured_weight: 0.75
  structured_tau: 0.5
  structured_low_support_threshold: 0
  structured_low_support_weight:
  structured_low_support_tau:
  # Optional post-fusion calibration. Positive temperature scaling preserves
  # class decisions; 1.0 is exact historical behavior.
  classification_output_temperature: 1.0
  virtual_expert_replicates: 1
  virtual_expert_support_fraction: 1.0
  virtual_expert_min_support_prefixes: 1
  virtual_expert_include_full_support: true
  virtual_expert_preserve_labels: true
  virtual_expert_full_support_weight: 1.0
  virtual_expert_subbag_weight: 1.0
  virtual_expert_seed: 42
  regression_branch_diagnostics: false
  regression_support_calibration: false
  regression_calibration_max_prefixes: 512
  regression_calibration_temperature: 20.0
  regression_calibration_mae_weight: 0.5
  regression_calibration_rmse_weight: 0.5
  regression_calibration_exclude_same_case: false
  regression_calibration_mix: 1.0
  regression_calibration_mix_by_budget: {}
  regression_expert_confidence_temperature: 1.0
  regression_interval_std_multiplier: 1.645
  expert_aggregation_diagnostics: false
  evaluation_profiles:
    - name: main
      retrieval_modes: [configured]
      prior_modes: [balanced, natural]
      prior_strengths: [1.0]
      retrieval_k: [5, 20, 50]
