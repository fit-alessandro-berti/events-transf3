# Frozen confirmation protocol for the learned temporal time-transform bank.
# It inherits only the established structured evaluation overlay; architecture
# and trained weights continue to come from the selected checkpoint directory.
extends: structured_memory_eval.yaml
experiment_name: learned_temporal_time_transform
fmv3_evaluation:
  tasks: [classification, regression]
  regression_branch_diagnostics: true
  # Branch weights are adapted from labeled support prefixes only. No query
  # labels, query errors, or test-case prefixes enter this calibration.
  regression_support_calibration: true
  regression_calibration_max_prefixes: 512
  regression_calibration_temperature: 100.0
  regression_calibration_mae_weight: 1.0
  regression_calibration_rmse_weight: 0.0
  regression_calibration_exclude_same_case: false
  # Equal blend: the trained query-specific gate protects RMSE tails while
  # the support-calibrated branch prior reduces typical absolute error.
  regression_calibration_mix: 0.5
